<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aang Face · 3D Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#242d34;background:#f3f3ee}body{display:grid;grid-template-columns:1fr 290px}main{position:relative;min-width:0;height:100vh}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;left:34px;top:28px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:2.5px;color:#72828c;font-weight:700}h1{font-weight:650;letter-spacing:-1px;font-size:32px;margin:8px 0}header p{font-size:12px;color:#70818c;margin:6px 0}.hint{position:absolute;left:34px;bottom:25px;font-size:12px;color:#70818c}.tag{position:absolute;right:24px;bottom:25px;font-size:11px;color:#6d8188;padding:8px 12px;border:1px solid #cad6d6;border-radius:20px}aside{background:#fffdf9;border-left:1px solid #dbe1de;padding:28px 22px;overflow:auto}h2{font-size:15px;margin:0 0 6px}.subtitle{font-size:11px;line-height:1.7;color:#8a969b;margin:0 0 22px}.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:27px}button{border:1px solid #e0e5e2;background:transparent;border-radius:7px;padding:9px 4px;font-size:12px;color:#63777f;cursor:pointer}button:hover,button.active{background:#e7f2f5;color:#246784;border-color:#adcfdc}.slider{margin-bottom:16px}label{font-size:12px;display:flex;justify-content:space-between}label span{color:#96a1a6;font-variant-numeric:tabular-nums}input{width:100%;accent-color:#60a8cb;height:3px;margin:12px 0 0}.footer{font-size:10px;color:#8d999e;line-height:1.8;border-top:1px solid #e7ebe8;padding-top:14px;margin-top:23px}.views{display:flex;gap:7px;margin-bottom:22px}.views button{flex:1}.error{padding:30px;color:#833} @media(max-width:720px){body{grid-template-columns:1fr}main{height:66vh}aside{height:auto}header{left:20px;top:18px}h1{font-size:23px}.hint{left:20px}.tag{display:none}}
</style></head><body><main><canvas id="view"></canvas><header><div class="eyebrow">CHARACTER ASSET / REVISED MODEL · V2</div><h1>Aang · Face v2</h1><p>수정한 3D 메시 · 블렌드셰이프 10개</p></header><div class="hint">드래그: 회전 &nbsp;·&nbsp; 스크롤: 확대 / 축소</div><div class="tag" id="stats"></div></main><aside><h2>표정 미리보기</h2><p class="subtitle">슬라이더를 섞어 표정을 조절하세요.<br>표정 값은 Unity의 0–100에 대응합니다.</p><div class="presets" id="presets"></div><div class="views"><button onclick="setView('front')">정면</button><button onclick="setView('three')">¾</button><button onclick="setView('side')">측면</button></div><div id="sliders"></div><div class="footer">첨부 이미지를 참고해 눈꺼풀·입술·턱·홍채를 다시 구성한 실제 3D 모델입니다. 회전 미리보기는 그림자를 간소화해 표시합니다.<br><br>이 미리보기는 GLB 및 Unity 패키지와 동일한 정점과 표정 데이터를 사용합니다.</div></aside>
<script id="meshdata" type="application/json">__MESH_DATA__</script><script>
'use strict';
const model=JSON.parse(document.getElementById('meshdata').textContent);
const canvas=document.getElementById('view');
const gl=canvas.getContext('webgl',{antialias:true,preserveDrawingBuffer:true,alpha:false});
if(!gl){document.body.innerHTML='<p class="error">WebGL을 사용할 수 없습니다. 하드웨어 가속을 켠 브라우저에서 열어주세요.</p>';throw Error('WebGL unavailable');}
if(!gl.getExtension('OES_element_index_uint'))throw Error('32-bit indices unsupported');
const vs=`attribute vec3 position;attribute vec3 normal;attribute vec3 vertexColor;uniform mat4 mvp;uniform mat3 rotation;varying vec3 N;varying vec3 P;varying vec3 C;void main(){C=vertexColor;N=rotation*normal;P=rotation*position;gl_Position=mvp*vec4(position,1.0);}`;
const fs=`precision highp float;varying vec3 N;varying vec3 P;varying vec3 C;void main(){vec3 n=normalize(N);vec3 l=normalize(vec3(-.65,1.,1.15));float key=max(0.,dot(n,l));float fill=max(0.,dot(n,normalize(vec3(.8,.3,.8))));vec3 linear=pow(C,vec3(2.2));vec3 c=linear*(.32+.09*n.y+.65*key+.13*fill);float spec=pow(max(0.,dot(n,normalize(l+vec3(0.,0.,1.)))),38.)*.027;c+=spec;gl_FragColor=vec4(pow(max(c,vec3(0.)),vec3(1./2.2)),1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const pos=new Float32Array(model.positions),nor=new Float32Array(model.normals),basePos=pos.slice(),baseNor=nor.slice();
const pb=gl.createBuffer(),nb=gl.createBuffer();
function attribute(buffer,name,array){gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,array,gl.DYNAMIC_DRAW);const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);}
attribute(pb,'position',pos);attribute(nb,'normal',nor);
const cb=gl.createBuffer();attribute(cb,'vertexColor',new Float32Array(model.colors));
const parts=model.submeshes.map((s,i)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b);const a=new Uint32Array(s.triangles);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,a,gl.STATIC_DRAW);return{buffer:b,count:a.length,color:model.materials[i].color.slice(0,3)};});
const weights={};model.blendShapes.forEach(s=>weights[s.name]=0);
const labels={Smile:'웃음',Angry:'화남',Sad:'슬픔',Surprised:'놀람',BlinkLeft:'왼쪽 눈 감기',BlinkRight:'오른쪽 눈 감기',JawOpen:'입 벌리기',MouthWide:'입 넓히기',MouthPucker:'입 오므리기',BrowRaise:'눈썹 올리기'};
for(const s of model.blendShapes){const d=document.createElement('div');d.className='slider';d.innerHTML=`<label>${labels[s.name]}<span id="n_${s.name}">0</span></label><input aria-label="${labels[s.name]}" id="s_${s.name}" type="range" min="0" max="100" value="0">`;document.getElementById('sliders').append(d);d.querySelector('input').addEventListener('input',e=>{weights[s.name]=+e.target.value/100;update();});}
const presets={'기본':{},'웃음':{Smile:1},'화남':{Angry:1},'슬픔':{Sad:1},'놀람':{Surprised:1},'눈 감기':{BlinkLeft:1,BlinkRight:1},'윙크':{Smile:.6,BlinkLeft:1},'말하기':{JawOpen:.8}};
for(const [name,value]of Object.entries(presets)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{setWeights(value);document.querySelectorAll('.presets button').forEach(x=>x.classList.toggle('active',x===b));};document.getElementById('presets').append(b);}
window.setWeights=function(values){for(const n in weights)weights[n]=values[n]||0;update();};
function update(){pos.set(basePos);nor.set(baseNor);for(const s of model.blendShapes){const w=weights[s.name];document.getElementById('s_'+s.name).value=w*100;document.getElementById('n_'+s.name).textContent=Math.round(w*100);if(!w)continue;for(let i=0;i<s.indices.length;i++){const k=s.indices[i]*3;for(let j=0;j<3;j++){pos[k+j]+=s.delta[i*3+j]*w;nor[k+j]+=s.normalDelta[i*3+j]*w;}}}attribute(pb,'position',pos);attribute(nb,'normal',nor);render();}
let yaw=-.27,pitch=.025,zoom=1;
window.setView=function(v){yaw={front:0,three:-.58,side:-1.42}[v]??0;pitch=.025;render();};
function render(){const dpr=Math.min(devicePixelRatio||1,2);const w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clearColor(.944,.951,.937,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);const cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);
const rot=[cy,sx*sy,-cx*sy, 0,cx,sx, sy,-sx*cy,cx*cy];const scale=5.0*zoom;const ax=scale*h/w,ay=scale;const mvp=new Float32Array([rot[0]*ax,rot[1]*ay,-rot[2]*1.8,0,rot[3]*ax,rot[4]*ay,-rot[5]*1.8,0,rot[6]*ax,rot[7]*ay,-rot[8]*1.8,0,0,-.04,0,1]);
gl.uniformMatrix4fv(gl.getUniformLocation(program,'mvp'),false,mvp);gl.uniformMatrix3fv(gl.getUniformLocation(program,'rotation'),false,new Float32Array(rot));for(const part of parts){gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,part.buffer);gl.drawElements(gl.TRIANGLES,part.count,gl.UNSIGNED_INT,0);}}
let drag=null;canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,yaw,pitch];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(drag){yaw=drag[2]+(e.clientX-drag[0])*.008;pitch=Math.max(-.75,Math.min(.75,drag[3]+(e.clientY-drag[1])*.008));render();}});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.8,zoom*Math.exp(-e.deltaY*.001)));render();},{passive:false});window.addEventListener('resize',render);
document.getElementById('stats').textContent=`${(pos.length/3).toLocaleString()} vertices · ${(parts.reduce((s,p)=>s+p.count,0)/3).toLocaleString()} triangles`;
render();window.meshReady=true;
</script></body></html>
